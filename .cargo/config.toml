# Linker rapide pour l'itération dev (voir CLAUDE.md).
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Build Windows natif, cross-compilé depuis WSL (demande mingw-w64) :
# `cargo windows` → target/x86_64-pc-windows-gnu/release/voxel_engine.exe.
# Sans `dev` : le linking dynamique de Bevy ne sert qu'à itérer sous Linux.
[alias]
windows = "build --release --no-default-features --target x86_64-pc-windows-gnu"
